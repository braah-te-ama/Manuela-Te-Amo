<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://fonts.googleapis.com/css2?family=Rock+Salt&display=swap" rel="stylesheet">
        <link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <title>Te Amo</title>
</head>
<style>
    .centrado-1{
        width: 100%;
        height: 100%;
        
    }
    .fotos{
        width: 100%;
        height: 75vh;
        border-bottom: 5px red dashed;
        padding: 10px;
    }

        h5.son-para-ti {
    color: #e40e0e;
    font-size: 2.5rem;
    font-family: Gloria Hallelujah;
    height: 65px;
    text-align: center;
}
h5.me-acuerdo-ti {
    font-family: 'Gloria Hallelujah';
    text-align: center;
    font-size: 1.5em;
}

.centrar-iframe {
    display: flex;
    justify-content: center;
    width: 100%;
}
.cancion {
    width: 600px;
    height: 300px;
    padding: 10px;
    background: black;
    border-radius: 20px;
    border: 6px solid #e40e0e;
    object-fit: cover;
}
h5.titulo-cancion {
    text-align: center;
    margin: 10px 0px 5px;
    font-family: 'Gloria Hallelujah';
    font-size: 1rem;
    color: #e40e0e;
}
h5.mensaje-secreto {
    text-align: center;
    padding: 5px 20px;
    color: white;
    background: red;
    position: absolute;
    border-radius: 5px;
    font-size: 1.1rem;
    font-family: 'Gloria Hallelujah';
}
.centrar-momento-importante {
    width: 100%;
    display: flex;
    justify-content: center;
}
    @media (max-width: 869px){
        .cancion {
    width: 330px;
    height: 230px;
    background: black;
    border-radius: 20px;
    border: 6px solid #e40e0e;
    object-fit: cover;
}
    }

</style>
<body>
    <div class="centrado-1">
        <div class="fotos">
            <h5 class="me-acuerdo-ti">esta canción me recuerda a ti ( > ᴗ < )</h5>
            <div class="centrar-iframe">
                <video poster="banner.png" controls src="cancion.mp4" class="cancion"></video>
         </div>
         <h5 class="titulo-cancion">Weltita - Bad Bunny</h5>
         <div class="centrar-momento-importante">
                     <h5 class="mensaje-secreto">Mensaje secreto 2:27 - 2:52</h5>

         </div>
        </div>
        <h5 class="son-para-ti">canción Tuya</h5>
        <div class="opciones">

        </div>
    </div>

</html>
